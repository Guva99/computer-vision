# Матрица испытаний (Задача 4) — таблица сценариев для tools/run_scenarios.py.
#
# Каждый сценарий = сочетание факторов; физическую установку препятствия
# выполняет оператор (раннер делает паузу и ждёт подтверждения перед каждым
# повтором). Поля obstacle/start_distance_m/lighting/occlusion — описательные:
# они попадают в scenarios_index.csv и используются compute_metrics.py для
# разбивки метрик по факторам.
#
# Поля:
#   scenario_id       — уникальный идентификатор (попадает во все логи)
#   description       — что ставим и что ожидаем (подсказка оператору)
#   obstacle          — тип препятствия (none | cube | box | hand | ...)
#   start_distance_m  — исходное расстояние препятствие↔траектория руки, м
#   robot_ctrl_speed  — % override скорости цикла робота
#   lighting          — normal | dim | bright
#   occlusion         — есть ли частичное перекрытие препятствия рукой (true/false)
#   danger_expected   — ожидается ли DANGER в этом сценарии (true/false) — GT
#                       уровня прогона для сводки TP/FP
#   repeats           — число повторов
#   duration_s        — длительность одного прогона, сек

# Э2 (динамика) идёт по S01-S08; S09-S10 относятся к Э3 (серия скорости) и в
# переборе динамики не участвуют — их запускает этап e3 мастера.
# Повторов 3 и прогон 30 с (было 5 и 60): рука успевает сделать 2-3 прохода за
# прогон, для эпизодных метрик этого достаточно, доверительный интервал шире.
defaults:
  robot_ctrl_speed: 30
  lighting: normal
  occlusion: false
  repeats: 3
  duration_s: 30

scenarios:
  - scenario_id: S01_baseline_empty
    description: "Пустая сцена, робот гоняет цикл — проверка ложных остановов"
    obstacle: none
    start_distance_m: null
    danger_expected: false

  - scenario_id: S02_cube_far
    description: "Кубик на столе вне траектории (>= 25 см от прохода руки)"
    obstacle: cube
    start_distance_m: 0.25
    danger_expected: false

  - scenario_id: S03_cube_near
    description: "Кубик у траектории (~10 см) — WARN, останов не обязателен"
    obstacle: cube
    start_distance_m: 0.10
    danger_expected: false

  - scenario_id: S04_cube_on_path
    description: "Кубик на траектории — рука проходит вплотную, ожидается DANGER+стоп"
    obstacle: cube
    start_distance_m: 0.03
    danger_expected: true

  - scenario_id: S05_cube_on_path_fast
    description: "То же, но скорость цикла выше"
    obstacle: cube
    start_distance_m: 0.03
    robot_ctrl_speed: 50
    danger_expected: true

  - scenario_id: S06_cube_occluded
    description: "Кубик частично перекрыт рукой при сближении"
    obstacle: cube
    start_distance_m: 0.05
    occlusion: true
    danger_expected: true

  - scenario_id: S07_box_dim_light
    description: "Белая коробка, приглушённый свет"
    obstacle: box
    start_distance_m: 0.05
    lighting: dim
    danger_expected: true

  - scenario_id: S08_dynamic_intrusion
    description: "Предмет вносится в зону во время движения (динамика)"
    obstacle: cube
    start_distance_m: null
    danger_expected: true


  # Повтор S08 стопкой кубиков вместо белой коробки. Заведён отдельно, чтобы НЕ
  # затирать прогоны с коробкой: там зафиксировано ограничение метода (светлый
  # объект целиком уходит в маску манипулятора и 5.5 с не детектируется).
  # Стопку рука физически задевает, поэтому только на ней «контакта не было»
  # означает предотвращение, а не геометрию.
  - scenario_id: S08b_intrusion_tower
    description: "Стопка кубиков вносится в зону во время движения (динамика)"
    obstacle: cube_tower
    start_distance_m: null
    danger_expected: true


  # Восстановление после снятия препятствия. Вся остальная матрица меряет, как
  # быстро система ОСТАНАВЛИВАЕТ; этот сценарий — как быстро она ОТПУСКАЕТ.
  # Простой после снятого останова — производственная цена метода.
  # Складываются три механизма: память объектов (collision_perm_clear_frames=10),
  # защёлка пропажи (collision_danger_lost_hold_frames=5) и гистерезис выхода
  # (collision_danger_exit_dist_m=0.10). Заодно проверяет, что resume_movement()
  # реально срабатывает: $OV_PRO на стенде залипал в нуле.
  # Ход прогона: пустая зона -> внести препятствие -> дождаться останова ->
  # убрать препятствие -> засечь, через сколько робот поедет.
  - scenario_id: S11_resume_after_clear
    description: "Препятствие вносится, робот встаёт, препятствие убирается — замер простоя"
    obstacle: cube_tower
    start_distance_m: null
    danger_expected: true

  # ── Э3, серия скорости: S04 (30%), S05 (50%), S09 (70%), S10 (100%) ────────
  # Копии S05 с другим override. На 70 и 100% контакт вероятен, поэтому мастер
  # требует подтвердить, что на траектории стоит ЛЁГКИЙ предмет (пенопласт или
  # пустая коробка) — по этим уровням меряется остаточная дистанция, а она по
  # определению набирается у самой границы.
  - scenario_id: S09_speed_70
    description: "Кубик на траектории, скорость цикла 70% — вероятен контакт"
    obstacle: cube
    start_distance_m: 0.03
    robot_ctrl_speed: 70
    danger_expected: true

  - scenario_id: S10_speed_100
    description: "Кубик на траектории, скорость цикла 100% — вероятен контакт"
    obstacle: cube
    start_distance_m: 0.03
    robot_ctrl_speed: 100
    danger_expected: true
